<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello World</title>
    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #111111;
            --button-bg: #f0f0f0;
            --button-text: #111111;
            --border-color: #dddddd;
            --icon-color: #111111;
        }

        [data-theme="dark"] {
            --bg-color: #1a1a1a;
            --text-color: #f0f0f0;
            --button-bg: #333333;
            --button-text: #f0f0f0;
            --border-color: #444444;
            --icon-color: #f0f0f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: background-color 0.3s ease, color 0.3s ease;
            padding: 20px;
        }

        .icons {
            display: flex;
            gap: 1.5rem;
            margin-bottom: 1.5rem;
            align-items: center;
        }

        .icons svg {
            width: 48px;
            height: 48px;
            fill: var(--icon-color);
            transition: fill 0.3s ease;
        }

        .icon-label {
            font-size: 0.75rem;
            text-align: center;
            margin-top: 0.25rem;
            opacity: 0.7;
        }

        .icon-item {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
        }

        p {
            font-size: 1.1rem;
            margin-bottom: 2rem;
            opacity: 0.85;
            text-align: center;
            max-width: 400px;
        }

        button {
            background-color: var(--button-bg);
            color: var(--button-text);
            border: 1px solid var(--border-color);
            padding: 0.75rem 1.5rem;
            font-size: 1rem;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease;
        }

        button:hover {
            transform: translateY(-1px);
        }

        button:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>
    <div class="icons">
        <div class="icon-item">
            <!-- Simple Grok-style icon (stylized G) -->
            <svg viewBox="0 0 24 24" aria-label="Grok icon" role="img">
                <circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2"/>
                <text x="12" y="16" text-anchor="middle" font-size="12" font-weight="bold" fill="currentColor" font-family="system-ui">G</text>
            </svg>
            <span class="icon-label">Grok</span>
        </div>
        <div class="icon-item">
            <!-- GitHub Mark (official path simplified for inline use) -->
            <svg viewBox="0 0 16 16" aria-label="GitHub icon" role="img">
                <path fill-rule="evenodd" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/>
            </svg>
            <span class="icon-label">GitHub</span>
        </div>
    </div>

    <h1>Hello World</h1>
    <p>This is a simple Hello World web page with light & dark theme switch.</p>
    <button id="theme-toggle" aria-label="Toggle light and dark theme">Switch to Dark Theme</button>

    <script>
        const toggleButton = document.getElementById("theme-toggle");
        const html = document.documentElement;

        // Check saved preference or system preference
        const savedTheme = localStorage.getItem("theme");
        const systemPrefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;

        if (savedTheme === "dark" || (!savedTheme && systemPrefersDark)) {
            html.setAttribute("data-theme", "dark");
            toggleButton.textContent = "Switch to Light Theme";
        }

        toggleButton.addEventListener("click", () => {
            const currentTheme = html.getAttribute("data-theme");
            if (currentTheme === "dark") {
                html.removeAttribute("data-theme");
                localStorage.setItem("theme", "light");
                toggleButton.textContent = "Switch to Dark Theme";
            } else {
                html.setAttribute("data-theme", "dark");
                localStorage.setItem("theme", "dark");
                toggleButton.textContent = "Switch to Light Theme";
            }
        });
    </script>
</body>
</html>
